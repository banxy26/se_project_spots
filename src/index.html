<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Stephanie S" />
    <meta name="description" content="???" />
    <meta name="keywords" content="HTML, CSS, ???" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          class="header__logo"
          src="<%=require('./images/logo.svg')%>"
          alt="Spots logo"
        />
      </header>

      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                class="profile__pencil-icon"
                src="<%=require('./images/pencil-light.svg')%>"
                alt="Pencil icon"
              />
            </button>

            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/pencil.svg')%>"
                alt="Pencil icon"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="<%=require('./images/add.svg')%>"
              class="profile__add-icon"
              alt="Add icon"
            />
            New Post
          </button>
        </section>
        <div class="cards page__section">
          <ul class="cards__list"></ul>
        </div>
        <template id="card-template">
          <li class="card">
            <button type="button" class="card__trash-btn"></button>
            <img class="card__image" src="" alt="" />
            <div class="card__content">
              <h2 class="card__title"></h2>
              <button type="button" class="card__like-button"></button>
            </div>
          </li>
        </template>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2025 &copy; Spots</p>
      </footer>
    </div>
    <div class="modal modal__opened" id="edit-modal">
      <div class="modal__container">
        <div class="modal__title-close">
          <h2 class="modal__title">Edit profile</h2>
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/closeXicon.svg')%>"
              class="modal__close-icon"
              alt="icon"
            />
          </button>
        </div>
        <form id="editProfileForm" name="edit profile" class="modal__form">
          <label class="modal__label">
            Name
            <input
              id="edit-profile-form-name"
              class="modal__input"
              name="name"
              placeholder="Type your name"
              type="text"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="edit-profile-form-name-error"
              >Please fill out this field.</span
            >
          </label>
          <label class="modal__label">
            Description
            <input
              id="edit-profile-form-description"
              class="modal__input"
              name="description"
              placeholder="Describe yourself"
              type="text"
              minlength="2"
              maxlength="200"
              required
            />
            <span class="modal__error" id="edit-profile-form-description-error"
              >Please lengthen this text to 2 characters or more (you are
              currently usina 1 character).</span
            >
          </label>
          <button type="submit" class="modal__button modal__submit-btn">
            Save
          </button>
        </form>
      </div>
    </div>
    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <div class="modal__title-close">
          <h2 class="modal__title">New post</h2>
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/closeXicon.svg')%>"
              class="modal__close-icon"
              alt="icon"
            />
          </button>
        </div>
        <form id="card-form" class="modal__form">
          <label class="modal__label">
            Image Link
            <input
              id="card-link-input"
              class="modal__input"
              name="link"
              placeholder="Paste a link to the picture"
              type="url"
              required
            />
            <span id="card-link-input-error" class="modal__error"
              >Please enter a URL.</span
            >
          </label>
          <label class="modal__label">
            Caption
            <input
              id="card-caption-input"
              class="modal__input"
              name="name"
              placeholder="Type your caption"
              type="text"
              minlength="2"
              maxlength="30"
              required
            />
            <span class="modal__error" id="card-caption-input-error"
              >Please fill out this field.</span
            >
          </label>
          <button type="submit" class="modal__button modal__submit-btn">
            Save
          </button>
        </form>
      </div>
    </div>

    <div class="modal" id="preview-modal">
      <div class="modal__container-image">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
        >
          <img
            src="<%=require('./images/close-light.svg')%>"
            class="modal__close-icon"
            alt="Close"
          />
        </button>
        <img class="modal__image" src="" alt="" />
        <p class="modal__caption"></p>
      </div>
    </div>

    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <div class="modal__title-close">
          <h2 class="modal__title">Edit profile avatar</h2>
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/closeXicon.svg')%>"
              class="modal__close-icon"
              alt="icon"
            />
          </button>
        </div>

        <form id="editAvatarForm" name="edit profile" class="modal__form">
          <label class="modal__label" for="profile-avatar-input">
            Avatar
            <input
              id="profile-avatar-input"
              class="modal__input"
              name="avatar"
              placeholder="Paste the link to an image"
              type="text"
              required
            />
            <span class="modal__error" id="profile-avatar-input-error"
              >Please fill out this field.</span
            >
          </label>
          <button type="submit" class="modal__button modal__submit-btn">
            Save
          </button>
        </form>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__container">
        <div class="modal__title-close">
          <h2 class="modal__title">
            Are you sure you want to delete this image?
          </h2>
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/closeXicon.svg')%>"
              class="modal__close-icon"
              alt="Close"
            />
          </button>
        </div>
        <form id="delete-form" class="modal__form">
          <button
            type="submit"
            class="modal__submit-btn modal__submit-btn_type_delete"
          >
            Delete
          </button>
          <button
            type="button"
            class="modal__submit-btn modal__submit-btn_type_cancel"
          >
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
